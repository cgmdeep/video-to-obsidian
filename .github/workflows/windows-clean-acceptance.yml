name: Windows clean acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: Prepare a fresh Windows user environment
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build embedded core wheel
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist, build, installer/windows/VideoToObsidian.Setup/Payload, installer/windows/VideoToObsidian.Setup/bin, installer/windows/VideoToObsidian.Setup/obj -ErrorAction SilentlyContinue
          python -m pip install --upgrade pip "build>=1,<2"
          python -m build --wheel --outdir artifacts/core-wheel
          $Wheels = @(Get-ChildItem artifacts/core-wheel/*.whl -File)
          if ($Wheels.Count -ne 1) {
            throw "Expected exactly one core wheel, found: $($Wheels.Name -join ', ')"
          }
          New-Item -ItemType Directory -Force installer/windows/VideoToObsidian.Setup/Payload | Out-Null
          Copy-Item $Wheels[0].FullName installer/windows/VideoToObsidian.Setup/Payload/
      - name: Publish installer
        shell: pwsh
        run: |
          dotnet publish installer/windows/VideoToObsidian.Setup/VideoToObsidian.Setup.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/windows-x64
      - name: Run full first-time preparation
        timeout-minutes: 16
        shell: pwsh
        run: |
          $Setup = Resolve-Path artifacts/windows-x64/VideoToObsidian.Setup.exe
          $Report = Join-Path $env:RUNNER_TEMP 'clean-prepare.json'
          $Process = Start-Process -FilePath $Setup -ArgumentList @('--prepare-machine', $Report) -PassThru
          $Deadline = (Get-Date).AddMinutes(15)
          $LastPhase = ''
          while (-not $Process.HasExited -and (Get-Date) -lt $Deadline) {
            Start-Sleep -Seconds 10
            $Process.Refresh()
            if (Test-Path $Report) {
              try {
                $Progress = Get-Content $Report -Raw | ConvertFrom-Json
                if ($Progress.phase -and $Progress.phase -ne $LastPhase) {
                  Write-Host "Installer phase: $($Progress.phase)"
                  $LastPhase = $Progress.phase
                }
              } catch {
                Write-Host 'Installer progress report is being updated.'
              }
            }
          }
          if (-not $Process.HasExited) {
            Stop-Process -Id $Process.Id -Force
            throw "Installer exceeded the 15-minute clean preparation limit. Last phase: $LastPhase"
          }
          if (-not (Test-Path $Report)) {
            throw "Installer did not produce a preparation report (exit $($Process.ExitCode))."
          }
          $Payload = Get-Content $Report -Raw | ConvertFrom-Json
          if ($Process.ExitCode -ne 0 -or -not $Payload.ok) {
            throw "Installer preparation failed: $($Payload.error_type): $($Payload.error)"
          }
          if (-not $Payload.vault_created -or -not $Payload.workspace_created) {
            throw "Installer did not create both the default Vault and workspace."
          }
          if ($Payload.contains_secrets -or $Payload.paid_call_performed) {
            throw "Free clean-install acceptance reported secrets or a paid call."
          }
          $Runtime = Join-Path $env:LOCALAPPDATA 'VideoToObsidian\runtime\Scripts\video-to-obsidian.exe'
          $Config = Join-Path $env:APPDATA 'VideoToObsidian\config.toml'
          $Vault = Join-Path ([Environment]::GetFolderPath('MyDocuments')) '视知库'
          $Workspace = Join-Path ([Environment]::GetFolderPath('MyDocuments')) '视知库助手'
          $Required = @(
            $Runtime,
            $Config,
            (Join-Path $Vault 'Douyin'),
            (Join-Path $Vault 'Bilibili'),
            (Join-Path $Workspace 'AGENTS.md'),
            (Join-Path $Workspace '.zcode\config.json')
          )
          $Missing = @($Required | Where-Object { -not (Test-Path $_) })
          if ($Missing.Count -gt 0) {
            throw "First-time preparation is incomplete: $($Missing -join ', ')"
          }
          $ProfilesIni = Join-Path $env:APPDATA 'Mozilla\Firefox\profiles.ini'
          if (-not (Test-Path $ProfilesIni) -or (Get-Content $ProfilesIni -Raw) -notmatch '(?m)^Name=VideoToObsidian$') {
            throw 'Installer did not create the isolated VideoToObsidian Firefox profile.'
          }
          $Plugin = Join-Path $Vault '.obsidian\plugins\shizhiku-local'
          foreach ($Name in @('main.js', 'manifest.json', 'styles.css')) {
            if (-not (Test-Path (Join-Path $Plugin $Name))) {
              throw "Standard preparation did not install Obsidian knowledge plugin asset: $Name"
            }
          }
          $Enabled = Get-Content (Join-Path $Vault '.obsidian\community-plugins.json') -Raw | ConvertFrom-Json
          if ($Enabled -notcontains 'shizhiku-local') {
            throw 'Standard preparation did not enable the Obsidian knowledge plugin.'
          }
          $ZCodePath = Join-Path $Workspace '.zcode\config.json'
          $ZCode = Get-Content $ZCodePath -Raw | ConvertFrom-Json
          $Servers = @($ZCode.mcp.servers.PSObject.Properties)
          if ($Servers.Count -ne 1 -or $Servers[0].Name -ne 'video-to-obsidian') {
            throw 'The clean workspace must contain exactly one managed MCP server.'
          }
          foreach ($SensitiveFile in @($Config, $ZCodePath)) {
            $Text = Get-Content $SensitiveFile -Raw
            if ($Text -match '(?i)(api[_-]?key|bearer|cookie)\s*[:=]') {
              throw "Possible secret material was written to $SensitiveFile"
            }
          }
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          $DoctorOut = Join-Path $env:RUNNER_TEMP 'doctor.json'
          $DoctorErr = Join-Path $env:RUNNER_TEMP 'doctor.stderr.txt'
          $Doctor = Start-Process -FilePath $Runtime -ArgumentList @('doctor', '--json') -RedirectStandardOutput $DoctorOut -RedirectStandardError $DoctorErr -Wait -PassThru
          $DoctorPayload = Get-Content $DoctorOut -Raw | ConvertFrom-Json
          if ($DoctorPayload.paid_call_performed) {
            throw 'The clean environment doctor unexpectedly reported a paid call.'
          }
          Copy-Item $Report artifacts/windows-x64/clean-prepare.json
      - name: Verify graphical installer contract
        timeout-minutes: 2
        shell: pwsh
        run: |
          ./scripts/test-windows-ui-contract.ps1 `
            -Setup artifacts/windows-x64/VideoToObsidian.Setup.exe `
            -ArtifactsDirectory artifacts/windows-x64 `
            -InstallZCodeLaunchProbe
      - name: Verify repair and uninstall lifecycle
        timeout-minutes: 25
        shell: pwsh
        run: |
          ./scripts/test-windows-lifecycle.ps1 `
            -Setup artifacts/windows-x64/VideoToObsidian.Setup.exe `
            -ArtifactsDirectory artifacts/windows-x64
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-clean-acceptance
          path: |
            artifacts/windows-x64/VideoToObsidian.Setup.exe
            artifacts/windows-x64/*.json
          if-no-files-found: warn
