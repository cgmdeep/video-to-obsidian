name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip ".[release]"
          python -m build
          python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  windows-onboarding:
    name: Build Windows onboarding
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $Errors = $null
          $Tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/uninstall.ps1),
            [ref]$Tokens,
            [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            throw ($Errors | ForEach-Object Message) -join "`n"
          }
      - name: Build embedded core wheel
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist, build, installer/windows/VideoToObsidian.Setup/Payload, installer/windows/VideoToObsidian.Setup/bin, installer/windows/VideoToObsidian.Setup/obj -ErrorAction SilentlyContinue
          python -m pip install --upgrade pip "build>=1,<2"
          python -m build --wheel --outdir artifacts/core-wheel
          $Wheels = @(Get-ChildItem artifacts/core-wheel/*.whl -File)
          if ($Wheels.Count -ne 1) {
            throw "Expected exactly one core wheel, found: $($Wheels.Name -join ', ')"
          }
          @'
          import pathlib
          import sys
          import zipfile

          wheel = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_names = [name for name in names if name.endswith(".dist-info/METADATA")]
              assert len(metadata_names) == 1, metadata_names
              metadata = archive.read(metadata_names[0]).decode("utf-8")
              assert any(
                  line.lower().startswith("requires-dist: selenium")
                  for line in metadata.splitlines()
              ), "wheel is missing the Selenium runtime dependency"
              assert any(name.endswith("/download/firefox.py") for name in names), (
                  "wheel is missing the Firefox download adapter"
              )
          '@ | python - $Wheels[0].FullName
          New-Item -ItemType Directory -Force installer/windows/VideoToObsidian.Setup/Payload | Out-Null
          Copy-Item $Wheels[0].FullName installer/windows/VideoToObsidian.Setup/Payload/
      - name: Publish single-file Windows onboarding
        run: dotnet publish installer/windows/VideoToObsidian.Setup/VideoToObsidian.Setup.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/windows-x64
      - name: Verify single-file payload
        shell: pwsh
        run: |
          $Files = Get-ChildItem artifacts/windows-x64 -File
          if ($Files.Count -ne 1 -or $Files[0].Name -ne 'VideoToObsidian.Setup.exe') {
            throw "Expected exactly one VideoToObsidian.Setup.exe, found: $($Files.Name -join ', ')"
          }
          $Verification = Join-Path $env:RUNNER_TEMP 'embedded-payload.json'
          $Process = Start-Process -FilePath $Files[0].FullName -ArgumentList @('--verify-payload', $Verification) -Wait -PassThru
          if ($Process.ExitCode -ne 0 -or -not (Test-Path $Verification)) {
            throw "Published setup failed embedded payload verification (exit $($Process.ExitCode))."
          }
          $Report = Get-Content $Verification -Raw | ConvertFrom-Json
          if (-not $Report.has_selenium -or -not $Report.sha256) {
            throw "Published setup contains an invalid embedded wheel."
          }
      - name: Upload Windows onboarding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VideoToObsidian-Setup-win-x64
          path: artifacts/windows-x64/VideoToObsidian.Setup.exe
          if-no-files-found: error
