[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-obsidian"
version = "0.1.0a0"
description = "Analyze Douyin and Bilibili videos with Kimi and save structured notes to Obsidian."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Video to Obsidian contributors" }]
keywords = ["obsidian", "douyin", "bilibili", "kimi", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "mcp>=1.28.1,<2",
  "yt-dlp>=2025.8.22,<2027",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
]
release = [
  "build>=1,<2",
  "twine>=6,<8",
]
security = [
  "pip-audit>=2.9,<3",
]

[project.urls]
Repository = "https://github.com/cgmdeep/video-to-obsidian"
Issues = "https://github.com/cgmdeep/video-to-obsidian/issues"
Security = "https://github.com/cgmdeep/video-to-obsidian/security/policy"

[project.scripts]
video-to-obsidian = "video_to_obsidian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
