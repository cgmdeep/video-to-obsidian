[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-obsidian"
version = "0.1.0a0"
description = "Analyze Douyin and Bilibili videos with Kimi and save structured notes to Obsidian."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Video to Obsidian contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
video-to-obsidian = "video_to_obsidian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
